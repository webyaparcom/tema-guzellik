<style>
  /* ust-kayan-cizgi — Tek, hareketli gösterge (her öğede ayrı çizgi değil): gezinme sırasında konum hissi veren uygulama benzeri etkileşim. */
  .modulex-ust-kayan-cizgi { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-ust-kayan-cizgi *, .modulex-ust-kayan-cizgi *::before, .modulex-ust-kayan-cizgi *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-ust-kayan-cizgi :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-ust-kayan-cizgi :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-ust-kayan-cizgi :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-ust-kayan-cizgi :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-ust-kayan-cizgi img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-ust-kayan-cizgi) img { height: auto; }
  .modulex-ust-kayan-cizgi [hidden] { display: none !important; }
  .modulex-ust-kayan-cizgi :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-ust-kayan-cizgi :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-ust-kayan-cizgi-ic { max-width: --max--; margin-inline: auto; }
  .modulex-ust-kayan-cizgi-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-ust-kayan-cizgi--bassiz .modulex-ust-kayan-cizgi-bas { display: none; }

  .modulex-ust-kayan-cizgi-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-ust-kayan-cizgi-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-ust-kayan-cizgi-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-ust-kayan-cizgi-dugme:hover { transform: translateY(-2px); }
  .modulex-ust-kayan-cizgi-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-ust-kayan-cizgi-dugme--ikincil:hover { border-color: --accent--; }

  .modulex-ust-kayan-cizgi { position: relative; z-index: 900; }
  .modulex-ust-kayan-cizgi-logo { display: inline-flex; flex: 0 1 auto; min-width: 0; align-items: center; color: inherit; text-decoration: none; }
  /* dar ekranda geniş logo/uzun ad çubuğu taşırmasın: logo daralır (img max-width 100%), ad sarar */
  .modulex-ust-kayan-cizgi-logo img { width: auto; max-height: --logoH--; }
  .modulex-ust-kayan-cizgi-ad { font-family: var(--mx-font-heading, inherit); font-size: 1.3rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
  .modulex-ust-kayan-cizgi-oge { position: relative; display: inline-flex; align-items: center; min-height: 44px; color: inherit; font-weight: 600; text-decoration: none; transition: color 0.2s ease, background 0.2s ease; }
  .modulex-ust-kayan-cizgi-oge:hover, .modulex-ust-kayan-cizgi-oge[aria-current="page"] { color: --accentInk--; }
  .modulex-ust-kayan-cizgi-cta { display: inline-flex; flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 8px 18px; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; white-space: nowrap; transition: transform 0.2s ease, box-shadow 0.2s ease; }
  .modulex-ust-kayan-cizgi-cta:hover { transform: translateY(-2px); box-shadow: 0 10px 20px -12px --accent--; }
  .modulex-ust-kayan-cizgi-cta .material-symbols-outlined, .modulex-ust-kayan-cizgi-tel .material-symbols-outlined, .modulex-ust-kayan-cizgi-posta .material-symbols-outlined { font-size: 18px; }
  .modulex-ust-kayan-cizgi-tel, .modulex-ust-kayan-cizgi-posta { display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; white-space: nowrap; }
  .modulex-ust-kayan-cizgi-tel:hover, .modulex-ust-kayan-cizgi-posta:hover { color: --accentInk--; }
  .modulex-ust-kayan-cizgi-dil:empty { display: none; }
  .modulex-ust-kayan-cizgi-ac { display: none; align-items: center; gap: 10px; min-width: 46px; min-height: 46px; padding: 0 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: inherit; font: inherit; font-weight: 700; }
  .modulex-ust-kayan-cizgi-ac-ikon { display: grid; gap: 4px; width: 20px; }
  .modulex-ust-kayan-cizgi-ac-ikon span { display: block; height: 2px; border-radius: 2px; background: currentColor; transition: transform 0.3s ease, opacity 0.3s ease; }
  .modulex-ust-kayan-cizgi--acik .modulex-ust-kayan-cizgi-ac-ikon span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
  .modulex-ust-kayan-cizgi--acik .modulex-ust-kayan-cizgi-ac-ikon span:nth-child(2) { opacity: 0; }
  .modulex-ust-kayan-cizgi--acik .modulex-ust-kayan-cizgi-ac-ikon span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
  .modulex-ust-kayan-cizgi-kapat { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1px solid --cizgi--; border-radius: 50%; background: transparent; color: inherit; }
  .modulex-ust-kayan-cizgi-perde { position: fixed; inset: 0; z-index: 1; background: color-mix(in srgb, --text-- 45%, transparent); animation: modulex-ust-kayan-cizgi-sol 0.3s ease both; }
  @keyframes modulex-ust-kayan-cizgi-sol { from { opacity: 0; } to { opacity: 1; } }

  .modulex-ust-kayan-cizgi-panel { display: grid; gap: 14px; }
  @media (max-width: 1024px) {
    .modulex-ust-kayan-cizgi--js .modulex-ust-kayan-cizgi-nav, .modulex-ust-kayan-cizgi--js .modulex-ust-kayan-cizgi-genis { display: none; }
    .modulex-ust-kayan-cizgi--js .modulex-ust-kayan-cizgi-ac { display: inline-flex; }
    .modulex-ust-kayan-cizgi-panel { position: absolute; inset-inline: 0; inset-block-start: 100%; padding: 16px 20px 24px; border-block-end: 1px solid --cizgi--; background: --bg--; box-shadow: 0 24px 40px -28px color-mix(in srgb, --text-- 55%, transparent); animation: modulex-ust-kayan-cizgi-in 0.3s ease both; }
    .modulex-ust-kayan-cizgi-pliste { display: grid; }
    .modulex-ust-kayan-cizgi-pliste .modulex-ust-kayan-cizgi-oge { width: 100%; min-height: 50px; border-block-end: 1px solid --cizgi--; font-size: 1.05rem; }
    .modulex-ust-kayan-cizgi-palt { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  }
  @media (min-width: 1025px) {
    .modulex-ust-kayan-cizgi-panel { display: none !important; }
  }
  @keyframes modulex-ust-kayan-cizgi-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

  .modulex-ust-kayan-cizgi-dal { position: relative; display: flex; flex-wrap: wrap; align-items: center; }
  .modulex-ust-kayan-cizgi-dal-ac { display: inline-grid; place-items: center; width: 32px; height: 32px; margin-inline-start: 2px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: inherit; }
  .modulex-ust-kayan-cizgi-dal-ac .material-symbols-outlined { font-size: 20px; transition: transform 0.2s ease; }
  .modulex-ust-kayan-cizgi-dal--acik > .modulex-ust-kayan-cizgi-dal-ac .material-symbols-outlined { transform: rotate(180deg); }
  .modulex-ust-kayan-cizgi-dal--aktif > .modulex-ust-kayan-cizgi-oge { color: --accentInk--; }
  .modulex-ust-kayan-cizgi-altliste { position: absolute; inset-block-start: 100%; inset-inline-start: 0; z-index: 5; display: none; gap: 2px; min-width: 230px; padding: 8px; border: 1px solid --cizgi--; border-radius: 14px; background: --bg--; color: --text--; box-shadow: 0 22px 44px -26px color-mix(in srgb, --text-- 55%, transparent); text-align: start; }
  .modulex-ust-kayan-cizgi-dal:hover > .modulex-ust-kayan-cizgi-altliste, .modulex-ust-kayan-cizgi-dal:focus-within > .modulex-ust-kayan-cizgi-altliste, .modulex-ust-kayan-cizgi-dal--acik > .modulex-ust-kayan-cizgi-altliste { display: grid; }
  .modulex-ust-kayan-cizgi-aoge { display: flex; align-items: center; min-height: 42px; padding: 6px 12px; border-radius: 9px; color: inherit; font-weight: 600; text-decoration: none; white-space: nowrap; text-transform: none; letter-spacing: 0; }
  .modulex-ust-kayan-cizgi-aoge:hover, .modulex-ust-kayan-cizgi-aoge[aria-current="page"] { background: color-mix(in srgb, --accent-- 12%, --bg--); color: --accentInk--; }
  .modulex-ust-kayan-cizgi-panel .modulex-ust-kayan-cizgi-altliste, .modulex-ust-kayan-cizgi-pliste .modulex-ust-kayan-cizgi-altliste { position: static; display: grid; width: 100%; min-width: 0; padding: 0 0 10px; padding-inline-start: 18px; border: 0; border-radius: 0; background: transparent; color: inherit; box-shadow: none; }
  .modulex-ust-kayan-cizgi-panel .modulex-ust-kayan-cizgi-dal-ac, .modulex-ust-kayan-cizgi-pliste .modulex-ust-kayan-cizgi-dal-ac { display: none; }
  .modulex-ust-kayan-cizgi-panel .modulex-ust-kayan-cizgi-aoge { min-height: 40px; color: inherit; font-size: 0.95rem; white-space: normal; }
  @media (max-width: 1024px) {
    .modulex-ust-kayan-cizgi:not(.modulex-ust-kayan-cizgi--js) .modulex-ust-kayan-cizgi-altliste { position: static; display: grid; box-shadow: none; }
  }

  .modulex-ust-kayan-cizgi-cubuk { display: flex; align-items: center; justify-content: space-between; gap: 16px 28px; padding-block: 16px; }
  .modulex-ust-kayan-cizgi-nav { position: relative; }
  .modulex-ust-kayan-cizgi-liste { display: flex; flex-wrap: wrap; gap: 4px 22px; }
  .modulex-ust-kayan-cizgi-gosterge { position: absolute; inset-inline-start: 0; inset-block-end: 2px; width: 0; height: 3px; border-radius: 3px; background: --accent--; opacity: 0; pointer-events: none; transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), width 0.35s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease; }
  .modulex-ust-kayan-cizgi:not(.modulex-ust-kayan-cizgi--gs) .modulex-ust-kayan-cizgi-liste > li > .modulex-ust-kayan-cizgi-oge[aria-current="page"] { box-shadow: inset 0 -3px 0 --accent--; }
  .modulex-ust-kayan-cizgi-son, .modulex-ust-kayan-cizgi-genis { display: flex; align-items: center; gap: 12px; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kayan-cizgi :is(.modulex-ust-kayan-cizgi-baslik, .modulex-ust-kayan-cizgi-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ust-kayan-cizgi-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ust-kayan-cizgi { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ust-kayan-cizgi *, .modulex-ust-kayan-cizgi *::before, .modulex-ust-kayan-cizgi *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ust-kayan-cizgi";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const cekmece = (s, P) => {
          const ac = s.querySelector("." + P + "-ac");
          const panel = ac ? document.getElementById(ac.getAttribute("aria-controls")) : null;
          if (!ac || !panel) return;
          s.classList.add(P + "--js");
          const perde = s.querySelector("." + P + "-perde");
          const modal = panel.getAttribute("aria-modal") === "true";
          const kok = document.documentElement;
          const kapa = (odak) => {
            if (panel.hidden) return;
            panel.hidden = true;
            if (perde) perde.hidden = true;
            ac.setAttribute("aria-expanded", "false");
            s.classList.remove(P + "--acik");
            if (modal) kok.style.overflow = "";
            if (odak) ac.focus();
          };
          const aci = () => {
            panel.hidden = false;
            if (perde) perde.hidden = false;
            ac.setAttribute("aria-expanded", "true");
            s.classList.add(P + "--acik");
            if (modal) kok.style.overflow = "hidden";
            const ilk = panel.querySelector("a[href], button");
            if (ilk) ilk.focus();
          };
          ac.addEventListener("click", () => (panel.hidden ? aci() : kapa(true)));
          panel.addEventListener("click", (e) => {
            if (e.target.closest("." + P + "-kapat")) kapa(true);
            else if (e.target.closest("a[href]")) kapa(false);
          });
          if (perde) perde.addEventListener("click", () => kapa(true));
          document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !panel.hidden) kapa(true); });
          if (modal) {
            panel.addEventListener("keydown", (e) => {
              if (e.key !== "Tab") return;
              const o = [...panel.querySelectorAll("a[href], button:not([disabled])")].filter((x) => x.offsetParent !== null);
              if (!o.length) return;
              if (e.shiftKey && document.activeElement === o[0]) { e.preventDefault(); o[o.length - 1].focus(); }
              else if (!e.shiftKey && document.activeElement === o[o.length - 1]) { e.preventDefault(); o[0].focus(); }
            });
          }
          const g = Number(ac.dataset.genis);
          if (g && window.matchMedia) window.matchMedia(`(min-width: ${g}px)`).addEventListener("change", (m) => { if (m.matches) kapa(false); });
        };
    const gosterge = (s, P) => {
          const nav = s.querySelector("." + P + "-nav");
          const g = s.querySelector("." + P + "-gosterge");
          if (!nav || !g) return;
          s.classList.add(P + "--gs");
          const ogeler = [...nav.querySelectorAll(":scope > ul > li > ." + P + "-oge")];
          const aktif = () => ogeler.find((o) => o.getAttribute("aria-current") === "page") || nav.querySelector("." + P + "-dal--aktif > ." + P + "-oge");
          const yer = (el) => {
            if (!el || !el.offsetWidth) { g.style.opacity = "0"; return; }
            const n = nav.getBoundingClientRect();
            const r = el.getBoundingClientRect();
            /* çizgi satır başına (inset-inline-start) bağlı: RTL'de sağ kenardan ölç, sola (eksi) kaydır */
            const rtl = getComputedStyle(nav).direction === "rtl";
            g.style.width = r.width + "px";
            g.style.transform = "translate(" + (rtl ? r.right - n.right : r.left - n.left) + "px, " + (r.bottom - n.bottom) + "px)";
            g.style.opacity = "1";
          };
          ogeler.forEach((o) => { o.addEventListener("mouseenter", () => yer(o)); o.addEventListener("focus", () => yer(o)); });
          nav.addEventListener("mouseleave", () => yer(aktif()));
          nav.addEventListener("focusout", (e) => { if (!nav.contains(e.relatedTarget)) yer(aktif()); });
          window.addEventListener("resize", () => yer(aktif()));
          yer(aktif());
        };
    const altmenu = (s, P) => {
          const dallar = [...s.querySelectorAll("." + P + "-dal")];
          if (!dallar.length) return;
          const kapa = (d, odak) => {
            const b = d.querySelector(":scope > ." + P + "-dal-ac");
            if (!d.classList.contains(P + "-dal--acik")) return;
            d.classList.remove(P + "-dal--acik");
            b.setAttribute("aria-expanded", "false");
            if (odak) b.focus();
          };
          dallar.forEach((d) => {
            const b = d.querySelector(":scope > ." + P + "-dal-ac");
            if (!b) return;
            b.addEventListener("click", () => {
              const acik = d.classList.contains(P + "-dal--acik");
              dallar.forEach((x) => kapa(x, false));
              if (!acik) { d.classList.add(P + "-dal--acik"); b.setAttribute("aria-expanded", "true"); }
            });
            d.addEventListener("keydown", (e) => { if (e.key === "Escape") kapa(d, true); });
          });
          document.addEventListener("click", (e) => { dallar.forEach((d) => { if (!d.contains(e.target)) kapa(d, false); }); });
        };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      cekmece(s, P, az);
      gosterge(s, P, az);
      altmenu(s, P, az);
    });
  })();
</script>
